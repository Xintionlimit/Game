name: 自动检查

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 获取项目
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 安装浏览器
        run: npx playwright install --with-deps chromium

      - name: 运行测试和构建
        run: npm run check
