name: 发布手机试玩版

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 获取项目
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: 安装依赖并构建
        run: |
          npm ci
          npm run build

      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 上传网站
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: 发布
        id: deployment
        uses: actions/deploy-pages@v4
